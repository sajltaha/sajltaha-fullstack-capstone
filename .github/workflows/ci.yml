name: Best Cars CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: pip install -r server/requirements.txt

      - name: Run Django checks
        run: python server/manage.py check

      - name: Run Django migrations
        run: python server/manage.py migrate --noinput

      - name: Run Django tests
        run: python server/manage.py test djangoapp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci

      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build
