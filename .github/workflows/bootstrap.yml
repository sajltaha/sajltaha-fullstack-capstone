name: Bootstrap capstone repository
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.repository == 'sajltaha/sajltaha-fullstack-capstone'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build complete capstone source
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/capstone-base
          git -C /tmp/capstone-base remote add origin https://github.com/ibm-developer-skills-network/xrwvm-fullstack_developer_capstone.git
          git -C /tmp/capstone-base fetch --depth 1 origin 6bf6c0a1d8dedb6d949c9878a99fafa33168319c
          git -C /tmp/capstone-base checkout --detach FETCH_HEAD
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=.git /tmp/capstone-base/ ./
          printf '%s' '' | base64 -d | gzip -d > /tmp/capstone.patch
          git apply --whitespace=nowarn /tmp/capstone.patch
          rm -f .github/workflows/bootstrap.yml .github/workflows/ci.yml
          git config user.name "Talgat Yerkhanuly"
          git config user.email "sajltaha@users.noreply.github.com"
          git add -A
          git commit -m "Complete IBM full stack capstone project"
          git push origin HEAD:main
